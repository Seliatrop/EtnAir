version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: etna
      POSTGRES_PASSWORD: etna_pass
      POSTGRES_DB: etna_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etna -d etna_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: etna_db
      DB_USER: etna
      DB_PASSWORD: etna_pass
    volumes:
      - ./:/work
    command: ["python", "seed_and_test.py"]
